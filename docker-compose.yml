# Local development without Kubernetes:  docker compose up --build
# App: http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "taskapp"]
      interval: 5s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DB_HOST: postgres
      DB_PASSWORD: taskapp
      APP_ENV: compose
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: only reachable through the frontend's nginx proxy (like in Kubernetes)

  frontend:
    build: ./app/frontend
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
