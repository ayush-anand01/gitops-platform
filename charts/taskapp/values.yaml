# Default values — environment files in gitops/envs/<env>/values.yaml override these.

environment: dev

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/ayush-anand01/taskapp-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

frontend:
  image:
    repository: ghcr.io/ayush-anand01/taskapp-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  database: taskapp
  user: taskapp
  # Demo only. Phase 2 replaces this with Sealed Secrets / External Secrets.
  password: change-me
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: taskapp.localtest.me

# Applied to every app container: no root, no privilege escalation, read-only FS where possible
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
