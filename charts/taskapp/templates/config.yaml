apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskapp.fullname" . }}-config
  labels: {{- include "taskapp.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  DB_HOST: {{ include "taskapp.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskapp.fullname" . }}-db
  labels: {{- include "taskapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
