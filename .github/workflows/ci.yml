name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    # The bot's own commits to gitops/ must not re-trigger CI
    paths-ignore:
      - "gitops/**"
      - "**.md"

permissions:
  contents: write    # commit the new image tag to gitops/
  packages: write    # push images to GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: lint + unit tests ----------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: app/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test
        if: matrix.service == 'backend'
        run: npm test
      - name: Build
        if: matrix.service == 'frontend'
        run: npm run build

  # ---------- Stage 1b: validate the Helm chart for every environment ----------
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint + render each environment
        run: |
          for env in dev staging prod; do
            helm lint charts/taskapp -f gitops/envs/$env/values.yaml
            helm template taskapp charts/taskapp -f gitops/envs/$env/values.yaml > /dev/null
          done

  # ---------- Stage 2: build, scan, push ----------
  build:
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/taskapp-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Security gate: fail the pipeline on fixable CRITICAL/HIGH CVEs
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.image }}:latest
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.image }}:latest

  # ---------- Stage 3: GitOps — record the new tag for dev ----------
  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dev image tags
        run: |
          tag="${{ needs.build.outputs.tag }}"
          yq -i ".backend.image.tag = \"$tag\" | .frontend.image.tag = \"$tag\"" gitops/envs/dev/values.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/envs/dev/values.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(dev): ${{ needs.build.outputs.tag }}"
          git pull --rebase origin main
          git push
