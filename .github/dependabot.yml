# Weekly dependency updates; each PR runs the full CI (tests + Trivy gate)
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/backend
    schedule: { interval: weekly }
    groups:
      backend-deps: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /app/frontend
    schedule: { interval: weekly }
    groups:
      frontend-deps: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /app/backend
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /app/frontend
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
